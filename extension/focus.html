<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode Active</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
            color: white;
        }
        h1 {
            font-size: 3em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🎯</div>
        <h1>Focus Mode Activated!</h1>
        <p>Stay focused on what matters</p>
        <h2>Focused time:</h2>
        <div id="timer" style="font-size:2em; margin-top:10px;">00:00</div>
    </div>
    <script src="focus.js">
        
    </script>

</html>
