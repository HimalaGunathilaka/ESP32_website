<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>MQTT Popup</title>

    <!-- <script src="mqttws31.min.js" defer></script> -->
    <!-- <script src="main.js" defer></script> -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            margin: 0;
            min-width: 200px;
            /* ensures minimum width */
            max-width: 300px;
            /* optional */
            border-radius: 12px;
            box-sizing: border-box;
            /* ensures padding included in width */
        }


        #focusBtn {
            width: 100%;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        #focusBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #focusBtn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
        }

        #focusBtn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        #focusBtn.active:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        #addBtn {
            padding: 8px 16px;
            background: #959ec7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 auto;
            display: block;
        }

        #addBtn.tag {
            background-color: #092fd8;

        }

        #pict {
            width: 100%;
            height: auto;
            display: none;
            margin-top: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <button id="focusBtn">Focus</button>
    <img id="pict" src="picture.jpg" alt="Scolding grandma">
    <div id="timer" style="font-size:2em; margin-top:10px;">00:00:00</div>
    <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button id="addBtn">Add</button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
