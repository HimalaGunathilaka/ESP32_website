<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            margin: 0;
            min-width: 200px;
            /* ensures minimum width */
            max-width: 300px;
            /* optional */
            border-radius: 12px;
            box-sizing: border-box;
            /* ensures padding included in width */
        }


        #focusBtn {
            width: 100%;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        #focusBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #focusBtn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
        }

        #focusBtn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        #focusBtn.active:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        /* img {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 8px;
        } */

        #pict {
            width: 100%;
            height: auto;
            display: none;
            margin-top: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div>
        <button id="focusBtn">Focus</button>
        <img id="pict" src="picture.jpg" alt="Scolding grandma">
        <div id="timer" style="font-size:2em; margin-top:10px;">00:00:00</div>
        <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button id="addBtn"
                style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">Add</button>
            <input id="websiteInput" placeholder="Enter website"
                style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
