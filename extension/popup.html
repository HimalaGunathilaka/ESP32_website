<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>MQTT Popup</title>
    <link rel="stylesheet" href="popup.css">

    <!-- <script src="mqttws31.min.js" defer></script> -->
    <!-- <script src="main.js" defer></script> -->
</head>

<body>

    <div style="margin-top: 12px; margin-bottom: 18px;">
        <button id="topRightBtn" class="top-right-btn">Blocked</button>
    </div>


    <!-- Main view -->
    <div id="view-main" class="view view-active">

        <div class="progress-container">
            <svg class="progress-ring" width="200" height="200">
                <circle class="progress-ring__circle progress-ring__background" stroke-width="12" fill="transparent"
                    r="85" cx="100" cy="100" />
                <circle class="progress-ring__circle progress-ring__progress" stroke-width="12" fill="transparent"
                    r="85" cx="100" cy="100" stroke-dasharray="534.07 534.07" stroke-dashoffset="0"
                    id="progressCircle" />
            </svg>
            <div id="timer">00:00</div>
        </div>
        <div id="totalTime" class="totalTime">Total: 00:00</div>

        <button id="focusBtn">Focus</button>
        <img id="pict" src="picture.jpg" alt="Scolding grandma">
    </div>

    <!-- URL view -->
    <div id="view-url" class="view">
        <div id="iconList"></div>
    </div>

    

    <!-- These are constant in both views -->
    <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button id="addBtn">Add</button>
    </div>
    <div id="addTooltip" class="tooltip">Can't add while focusing</div>

    <div id="confetti-container"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></div>

    <script src="libs/tsparticles.confetti.bundle.min.js"></script>
    <script src="popup.js"></script>

</body>

</html>
